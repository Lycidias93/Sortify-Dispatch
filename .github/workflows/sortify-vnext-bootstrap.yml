name: sortify-vnext-bootstrap

on:
  push:
    branches:
      - chatgpt/sortify-vnext-core061-20260821

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Sortify
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout WebUI Core 0.6.1
        uses: actions/checkout@v4
        with:
          repository: Lycidias93/android-root-module-webui-template
          ref: 6fbd1b018a45fe5b1bebba7aeb9142423eab47fb
          path: .webui-template

      - name: Sync shared WebUI core
        shell: bash
        run: ./.webui-template/scripts/sync-core.sh --apply "$GITHUB_WORKSPACE"

      - name: Restructure legacy flat module source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p module/bin module/config
          mv action.sh module/bin/sortify-domain
          mv service.sh module/service.sh
          mv customize.sh module/customize.sh
          mv uninstall.sh module/uninstall.sh
          mv sortify.conf module/config/sortify.conf.default
          mv module.prop module/module.prop
          cp -f banner.png module/banner.png
          rm -rf webroot
          chmod 0755 module/bin/sortify-domain module/action.sh module/service.sh module/customize.sh module/uninstall.sh
          git status --short

      - name: Commit synchronized source layout
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'refactor: adopt shared WebUI Core 0.6.1 source layout'
          git push origin HEAD:chatgpt/sortify-vnext-core061-20260821
