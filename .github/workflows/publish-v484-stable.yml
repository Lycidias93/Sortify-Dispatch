name: Publish Sortify 4.8.4 stable

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v484-stable.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TAG: v4.8.4-webui-action-launch-hotfix
      ASSET: dist/Sortify-Dispatch-4.8.4-webui-action-launch-hotfix.zip
      ACCEPTED_ARTIFACT_ID: '9991166629'
      EXPECTED_SHA256: 6fd05118990e797d8868e6dd8279c220ddf881aad072872c9752fbc1387eecc1
      EXPECTED_BYTES: '2502058'
      TARGET_SHA: a3bce87db788b861709df656e349bb9dd0e61bd3
      PROMOTION_BRANCH: automation/v484-public-frontdoors
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore exact accepted package
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/accepted-artifact.zip"
          extract="$RUNNER_TEMP/accepted-artifact"
          mkdir -p "$extract" "$(dirname "$ASSET")"
          gh api -H 'Accept: application/vnd.github+json' "/repos/$GITHUB_REPOSITORY/actions/artifacts/$ACCEPTED_ARTIFACT_ID/zip" > "$archive"
          unzip -q "$archive" -d "$extract"
          accepted="$extract/$(basename "$ASSET")"
          test -f "$accepted"
          test "$(stat -c %s "$accepted")" = "$EXPECTED_BYTES"
          printf '%s  %s\n' "$EXPECTED_SHA256" "$accepted" | sha256sum -c -
          cp "$accepted" "$ASSET"
          printf '%s\n' 'accepted_artifact_restore=PASS'

      - name: Publish or verify stable release
        shell: bash
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/release-notes.md"
          printf '%s\n' \
            '## What changed' \
            '' \
            '- Fixes the module-manager Action button opening an unreachable local WebUI.' \
            '- Fixes productive Sort now showing a network error on large Download trees. Productive sorting now runs as a background Job while Preview stays synchronous.' \
            '- Existing Sortify settings and persistent configuration are preserved.' \
            '' \
            'Install or update the module with a Magisk/KernelSU-compatible module manager and reboot once.' \
            > "$notes"
          if gh release view "$TAG" >/dev/null 2>&1; then
            dir="$RUNNER_TEMP/existing-release"
            mkdir -p "$dir"
            gh release download "$TAG" --pattern "$(basename "$ASSET")" --dir "$dir"
            existing="$dir/$(basename "$ASSET")"
            test "$(stat -c %s "$existing")" = "$EXPECTED_BYTES"
            printf '%s  %s\n' "$EXPECTED_SHA256" "$existing" | sha256sum -c -
            printf '%s\n' 'release_state=existing_verified'
          else
            gh release create "$TAG" "$ASSET" --target "$TARGET_SHA" --title 'Sortify Dispatch 4.8.4' --notes-file "$notes"
            printf '%s\n' 'release_state=created'
          fi

      - name: Verify published release asset
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/release-verify"
          mkdir -p "$dir"
          gh release download "$TAG" --pattern "$(basename "$ASSET")" --dir "$dir"
          published="$dir/$(basename "$ASSET")"
          test "$(stat -c %s "$published")" = "$EXPECTED_BYTES"
          printf '%s  %s\n' "$EXPECTED_SHA256" "$published" | sha256sum -c -
          gh release view "$TAG" --json tagName,isDraft,isPrerelease,targetCommitish,url
          printf '%s\n' 'RESULT: SORTIFY_V484_STABLE_RELEASE_PUBLISH_PASS'

      - name: Prepare public frontdoor pull-request branch
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/promote-v484-stable.py
          git diff --check
          grep -Fq '"version": "4.8.4-webui-action-launch-hotfix"' update.json
          grep -Fq '## Sortify Dispatch 4.8.4' README.md
          grep -Fq '## 4.8.4-webui-action-launch-hotfix - WebUI Action Launch Hotfix' CHANGELOG.md
          grep -Fq '## What changed' RELEASE_NOTES_v4.8.4-webui-action-launch-hotfix.md
          git rm .github/workflows/publish-v484-stable.yml tools/promote-v484-stable.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md CHANGELOG.md RELEASE_NOTES_v4.8.4-webui-action-launch-hotfix.md update.json
          git commit -m 'Promote Sortify 4.8.4 public frontdoors'
          git push --force origin "HEAD:refs/heads/$PROMOTION_BRANCH"
          printf '%s\n' 'RESULT: SORTIFY_V484_PUBLIC_FRONTDOOR_BRANCH_PASS'
