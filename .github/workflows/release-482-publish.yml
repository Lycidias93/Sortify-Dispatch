name: Sortify 4.8.2 controlled stable publish

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-482-publish.yml'

permissions:
  contents: write

jobs:
  publish:
    if: github.repository == 'Lycidias93/Sortify-Dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REPO: Lycidias93/Sortify-Dispatch
      TARGET: 2b394896a2ac91bc8e7f19e559653a46a6f2630a
      TAG: v4.8.2-webui-functional-hotfix
      TITLE: Sortify Dispatch 4.8.2 – WebUI Functional Hotfix
      VERSION: 4.8.2-webui-functional-hotfix
      VERSION_CODE: '29'
      ASSET_NAME: Sortify-Dispatch-4.8.2-webui-functional-hotfix.zip
      EXPECTED_SHA256: f71b020a6e6b44ac68ab2c6c894d0b55268be58534ab105bce32a499422034e0
      EXPECTED_BYTES: '2497201'
      NOTES: RELEASE_NOTES_v4.8.2-webui-functional-hotfix.md
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact accepted release target
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET }}
          submodules: recursive
          fetch-depth: 0

      - name: Set up Go from pinned WebUI Core
        uses: actions/setup-go@v7
        with:
          go-version-file: .webui-core/go.mod
          cache: false

      - name: Verify exact accepted candidate and release preflight
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET"
          test -s "$NOTES"
          test "$(sed -n 's/^version=//p' module/module.prop | head -n1)" = "$VERSION"
          test "$(sed -n 's/^versionCode=//p' module/module.prop | head -n1)" = "$VERSION_CODE"
          bash tools/test-vnext.sh --source-only
          python3 .webui-core/scripts/webui-release-audit.py
          bash .webui-core/scripts/integration-test.sh
          bash tools/build-release.sh
          asset="dist/$ASSET_NAME"
          test -f "$asset"
          test "$(sha256sum "$asset" | awk '{print $1}')" = "$EXPECTED_SHA256"
          test "$(stat -c '%s' "$asset")" = "$EXPECTED_BYTES"

          release_ids="$(gh api "repos/$REPO/releases?per_page=100" --jq ".[] | select(.tag_name==\"$TAG\") | .id")"
          release_count="$(printf '%s\n' "$release_ids" | sed '/^$/d' | wc -l | tr -d ' ')"
          test "$release_count" -le 1
          if [ "$release_count" -eq 1 ]; then
            stale_id="$(printf '%s\n' "$release_ids" | sed -n '1p')"
            test "$(gh api "repos/$REPO/releases/$stale_id" --jq '.draft')" = 'true'
            test "$(gh api "repos/$REPO/releases/$stale_id" --jq '.prerelease')" = 'false'
            test "$(gh api "repos/$REPO/releases/$stale_id" --jq '.tag_name')" = "$TAG"
            test "$(gh api "repos/$REPO/releases/$stale_id" --jq '.name')" = "$TITLE"
            test "$(gh api "repos/$REPO/releases/$stale_id" --jq '.target_commitish')" = "$TARGET"
            stale_asset_count="$(gh api "repos/$REPO/releases/$stale_id/assets" --jq ".[] | select(.name==\"$ASSET_NAME\") | .id" | wc -l | tr -d ' ')"
            test "$stale_asset_count" = '1'
            stale_asset_size="$(gh api "repos/$REPO/releases/$stale_id/assets" --jq ".[] | select(.name==\"$ASSET_NAME\") | .size")"
            test "$stale_asset_size" = "$EXPECTED_BYTES"
            gh api --method DELETE "repos/$REPO/releases/$stale_id"
            echo 'stale_same_lane_draft_cleanup=PASS'
          fi

          if gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo 'release_tag_collision=FAIL'
            exit 1
          fi
          if gh api "repos/$REPO/releases/tags/$TAG" >/dev/null 2>&1; then
            echo 'release_collision=FAIL'
            exit 1
          fi
          remaining=1
          for _ in $(seq 1 20); do
            remaining="$(gh api "repos/$REPO/releases?per_page=100" --jq ".[] | select(.tag_name==\"$TAG\") | .id" | wc -l | tr -d ' ')"
            [ "$remaining" = '0' ] && break
            sleep 0.5
          done
          test "$remaining" = '0'
          echo 'release_preflight=PASS'

      - name: Create draft, verify, publish and public-redownload verify
        shell: bash
        run: |
          set -euo pipefail
          draft_id=''
          published=0
          cleanup_on_error() {
            rc=$?
            if [ "$rc" -ne 0 ] && [ -n "$draft_id" ] && [ "$published" -eq 0 ]; then
              gh api --method DELETE "repos/$REPO/releases/$draft_id" >/dev/null 2>&1 || true
              if gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
                ref_target="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha' 2>/dev/null || true)"
                if [ "$ref_target" = "$TARGET" ]; then
                  gh api --method DELETE "repos/$REPO/git/refs/tags/$TAG" >/dev/null 2>&1 || true
                fi
              fi
            fi
            exit "$rc"
          }
          trap cleanup_on_error EXIT

          gh release create "$TAG" "dist/$ASSET_NAME" --repo "$REPO" --target "$TARGET" --title "$TITLE" --notes-file "$NOTES" --draft

          draft_count=0
          draft_ids=''
          for _ in $(seq 1 20); do
            draft_ids="$(gh api "repos/$REPO/releases?per_page=100" --jq ".[] | select(.tag_name==\"$TAG\") | select(.draft==true) | .id" || true)"
            draft_count="$(printf '%s\n' "$draft_ids" | sed '/^$/d' | wc -l | tr -d ' ')"
            [ "$draft_count" = '1' ] && break
            sleep 0.5
          done
          test "$draft_count" = '1'
          draft_id="$(printf '%s\n' "$draft_ids" | sed -n '1p')"
          test -n "$draft_id"
          test "$(gh api "repos/$REPO/releases/$draft_id" --jq '.draft')" = 'true'
          test "$(gh api "repos/$REPO/releases/$draft_id" --jq '.prerelease')" = 'false'
          test "$(gh api "repos/$REPO/releases/$draft_id" --jq '.name')" = "$TITLE"
          test "$(gh api "repos/$REPO/releases/$draft_id" --jq '.tag_name')" = "$TAG"
          test "$(gh api "repos/$REPO/releases/$draft_id" --jq '.target_commitish')" = "$TARGET"
          asset_count="$(gh api "repos/$REPO/releases/$draft_id/assets" --jq ".[] | select(.name==\"$ASSET_NAME\") | .id" | wc -l | tr -d ' ')"
          test "$asset_count" = '1'
          asset_size="$(gh api "repos/$REPO/releases/$draft_id/assets" --jq ".[] | select(.name==\"$ASSET_NAME\") | .size")"
          test "$asset_size" = "$EXPECTED_BYTES"

          gh api --method PATCH "repos/$REPO/releases/$draft_id" -F draft=false -F prerelease=false >/dev/null
          published=1
          trap - EXIT

          public_id=''
          for _ in $(seq 1 20); do
            public_id="$(gh api "repos/$REPO/releases/tags/$TAG" --jq '.id' 2>/dev/null || true)"
            [ -n "$public_id" ] && break
            sleep 0.5
          done
          test "$public_id" = "$draft_id"
          test "$(gh api "repos/$REPO/releases/$public_id" --jq '.draft')" = 'false'
          test "$(gh api "repos/$REPO/releases/$public_id" --jq '.prerelease')" = 'false'
          test "$(gh api "repos/$REPO/releases/$public_id" --jq '.name')" = "$TITLE"
          test "$(gh api "repos/$REPO/releases/$public_id" --jq '.tag_name')" = "$TAG"

          ref_target=''
          for _ in $(seq 1 20); do
            ref_target="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha' 2>/dev/null || true)"
            [ -n "$ref_target" ] && break
            sleep 0.5
          done
          test "$ref_target" = "$TARGET"

          public_asset_count="$(gh api "repos/$REPO/releases/$public_id/assets" --jq ".[] | select(.name==\"$ASSET_NAME\") | .id" | wc -l | tr -d ' ')"
          test "$public_asset_count" = '1'
          public_asset_size="$(gh api "repos/$REPO/releases/$public_id/assets" --jq ".[] | select(.name==\"$ASSET_NAME\") | .size")"
          test "$public_asset_size" = "$EXPECTED_BYTES"

          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          gh release download "$TAG" --repo "$REPO" --pattern "$ASSET_NAME" --dir "$tmp"
          test "$(sha256sum "$tmp/$ASSET_NAME" | awk '{print $1}')" = "$EXPECTED_SHA256"
          test "$(stat -c '%s' "$tmp/$ASSET_NAME")" = "$EXPECTED_BYTES"
          release_body="$(gh api "repos/$REPO/releases/$public_id" --jq '.body')"
          notes_body="$(cat "$NOTES")"
          test "$release_body" = "$notes_body"
          echo 'public_download_hash=PASS'
          echo 'release_kind=stable'
          echo 'RESULT: SORTIFY_482_RELEASE_PUBLISH_DONE outcome=success workflow_exit_code=0'
